name: Build and Publish Docker Image

# 1. Определяем события, которые запускают workflow
on:
  push:
    branches: [ "main" ] # Запускать при пуше в ветку main
    tags: [ 'v*.*.*' ]    # И при создании тега, например, v1.0.0
  pull_request:
    branches: [ "main" ] # Проверять сборку при создании Pull Request

env:
  # Имя образа в формате ghcr.io/ВЛАДЕЛЕЦ/РЕПОЗИТОРИЙ
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # 2. Необходимые разрешения для доступа к репозиторию и GHCR
    permissions:
      contents: read    # Чтение кода из репозитория
      packages: write   # Запись (публикация) образа в GHCR

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 3. Настройка Docker Buildx (для продвинутой сборки)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Логин в GitHub Container Registry
      # Используется автоматический токен GITHUB_TOKEN, создавать ничего не нужно!
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Автоматическое создание тегов и меток для образа
      # Этот шаг сам разберется, какую версию присвоить (latest, v1.0.0, SHA и т.д.)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      # 6. Сборка и публикация Docker-образа
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }} # Не пушить при Pull Request
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # Кэширование для ускорения сборки
          cache-to: type=gha,mode=max